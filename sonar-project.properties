sonar.projectKey=xdubois-57_secondstay
sonar.organization=xdubois-57
sonar.projectName=SecondStay

sonar.sources=src,public/assets/js,templates,translations,migrations
sonar.tests=tests
sonar.exclusions=public/assets/vendor/**,vendor/**,node_modules/**,build/**,coverage/**
sonar.test.exclusions=vendor/**,node_modules/**

sonar.sourceEncoding=UTF-8

# Détection de copier-coller : les catalogues de traduction et les migrations
# en sont exclus.
#
# I18N.md **exige** que les quatre langues portent exactement les mêmes clés, et
# `TranslationCatalogueTest` fait échouer la construction si ce n'est pas le
# cas. Mesurer la duplication de ces fichiers revient donc à mesurer une
# exigence : la seule façon d'y répondre serait de casser la règle qu'ils
# servent. Même raisonnement pour les migrations, dont le DDL se répète par
# nature et qui ne sont jamais modifiées après publication (empreintes).
#
# La règle reste appliquée partout ailleurs — code PHP, JavaScript, gabarits.
sonar.cpd.exclusions=translations/**,migrations/**

# Couverture PHP : les trois campagnes, pas seulement la suite unitaire.
#
# Les tests de base de données exercent les dépôts et les services ; la
# campagne Playwright traverse les contrôleurs, que rien d'autre n'atteint.
# N'en compter qu'une faisait apparaître comme non couvert du code qui l'est
# réellement — la mesure décrivait alors l'outillage, pas le produit.
sonar.php.coverage.reportPaths=build/coverage/clover-unit.xml,build/coverage/clover-database.xml,build/coverage/clover-e2e-desktop.xml,build/coverage/clover-e2e-mobile.xml
sonar.php.tests.reportPath=build/reports/phpunit-junit.xml
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.qualitygate.wait=true
