# Seconde lecture par Claude, à l'ouverture d'une pull request et à chaque
# poussée sur celle-ci, à côté de la revue CodeRabbit configurée dans
# `.coderabbit.yaml`.
#
# Personne n'a à y penser : GitHub déclenche ce workflow sur l'événement
# `pull_request`, que quelqu'un s'en souvienne ou non. C'est tout l'intérêt —
# un relecteur qu'il faut convoquer est un relecteur qu'on oublie de convoquer
# précisément sur la pull request qui en avait besoin.
#
# Chaque exécution dépense l'abonnement Claude derrière
# `CLAUDE_CODE_OAUTH_TOKEN`, et `synchronize` ci-dessous signifie une
# exécution par poussée plutôt qu'une par pull request. C'est le prix
# délibéré d'une revue qui n'est jamais périmée.

name: Claude review

# Refus par défaut au niveau du workflow ; chaque travail s'accorde ensuite
# exactement ce dont il a besoin. Sans cette ligne, un travail qui oublierait
# son propre bloc `permissions:` hériterait en silence du défaut du dépôt.
permissions: {}

on:
  pull_request:
    # `opened` prend une pull request créée prête à relire ;
    # `ready_for_review` celle qui a commencé en brouillon ; `reopened` celle
    # qu'on rouvre ; `synchronize` chaque poussée sur une pull request
    # ouverte. `labeled` n'est pas un déclencheur automatique : c'est le
    # levier manuel décrit plus bas, pour redemander une passe sans pousser.
    #
    # `synchronize` est ce qui rend la revue actuelle plutôt qu'une photo du
    # premier commit : un diff relu à l'ouverture puis poussé cinq fois est un
    # diff que personne n'a lu.
    types: [opened, ready_for_review, reopened, labeled, synchronize]

# Un second déclenchement pendant qu'une exécution est en vol la remplace au
# lieu de payer les deux — ce qui compte d'autant plus avec `synchronize` :
# trois commits poussés en une minute paient une revue de l'état final, pas
# trois d'états intermédiaires. L'exécution annulée appartient au commit
# dépassé, donc elle ne laisse jamais de rouge sur celui qui compte.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review
    # Deux gardes, et la seconde empêche `labeled` de transformer chaque
    # étiquette en revue : sur un événement d'étiquetage, seule
    # `claude-review` qualifie. La poser sur une pull request déjà relue est
    # la façon de redemander une passe sans pousser.
    #
    # Les brouillons sont ignorés — le diff bouge encore, et CodeRabbit les
    # ignore aussi. `ready_for_review` reprend la pull request à l'instant où
    # elle cesse d'en être un.
    if: >-
      github.event.pull_request.draft == false &&
      (github.event.action != 'labeled' || github.event.label.name == 'claude-review')
    runs-on: ubuntu-latest

    # Une exécution partie en vrille dépense l'abonnement pour rien. La revue
    # prend quelques minutes ; ceci est un plafond, pas une cible.
    timeout-minutes: 20

    outputs:
      # Lu par le travail `status`, qui doit pouvoir distinguer « rien à
      # signaler » de « aucune revue n'était possible ».
      token_present: ${{ steps.guard.outputs.present }}

    permissions:
      contents: read
      pull-requests: read
      issues: read
      # Exigé par l'authentification par défaut de l'action : c'est ce qui lui
      # permet de poser des commentaires en ligne sans jeton propre.
      id-token: write

    steps:
      # Sans le secret, l'action échouerait à l'authentification et poserait un
      # rouge permanent sur chaque pull request jusqu'à ce que quelqu'un le
      # crée. Ce n'est pas la bonne façon de le demander : un rouge qu'on
      # apprend à ignorer désarme tous les autres.
      #
      # On saute donc la revue et on le **dit**, dans le commentaire de statut,
      # en toutes lettres. Un vert accompagné de « aucune revue n'a eu lieu,
      # voici pourquoi » est honnête ; un vert silencieux ne l'aurait pas été.
      - name: Le secret est-il configuré ?
        id: guard
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${TOKEN}" ]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN absent — aucune revue Claude n'a eu lieu."
          fi

      # `actions/checkout` reste sur son tag majeur, comme partout ailleurs
      # dans ce dépôt : elle vient du même fournisseur que l'exécuteur
      # (voir l'en-tête de `checks.yml`). L'action tierce ci-dessous est
      # épinglée sur un commit, elle.
      - uses: actions/checkout@v4
        if: steps.guard.outputs.present == 'true'
        with:
          # Historique complet : la revue lit la branche contre sa base.
          fetch-depth: 0
          # La revue ne fait que lire. Laisser l'identifiant de checkout dans
          # `.git/config` le remettrait à chaque étape suivante et à tout
          # artefact construit depuis l'espace de travail.
          persist-credentials: false

      # ÉCART CONNU, à lire avant de s'y fier.
      #
      # L'action refuse de tourner quand ce fichier diffère de la copie
      # présente sur la branche par défaut — précaution saine, sans quoi une
      # pull request pourrait réécrire son propre relecteur et faire ce
      # qu'elle veut du jeton. Mais elle sort en `success`, pas en `neutral`
      # ni en échec.
      #
      # Conséquence : une pull request qui modifie ce fichier obtient un
      # `Claude review` vert sans qu'aucune revue n'ait eu lieu — et c'est
      # précisément la pull request qu'on voudrait faire lire. Deux choses à
      # savoir plutôt qu'à redécouvrir : un vert ici ne prouve qu'une revue a
      # eu lieu que si ce fichier est intact, et la première exécution après
      # toute modification de ce fichier est un saut.
      #
      # Ce qui refermerait l'écart : `.github/CODEOWNERS` **et** « exiger la
      # revue des propriétaires de code » sur `main`, c'est-à-dire un humain
      # approuvant toute modification de ce fichier. Les deux moitiés doivent
      # tenir réellement — GitHub ignore en silence une entrée CODEOWNERS
      # nommant quelqu'un qui n'a pas accès en écriture, donc une règle peut
      # être activée, paraître active, et ne correspondre à rien.
      #
      # La seconde moitié n'est pas activée et ne peut pas l'être tant que ce
      # dépôt n'a qu'un collaborateur : GitHub interdit d'approuver sa propre
      # pull request, donc l'unique propriétaire de code qui est aussi
      # l'unique auteur ne pourrait jamais satisfaire la règle, et chaque
      # pull request deviendrait définitivement non fusionnable. S'ajouter à
      # la liste de contournement du ruleset rétablirait la fusion et ne
      # protégerait de personne.
      #
      # L'écart est donc ouvert, et sa seule grâce est de n'avoir aujourd'hui
      # aucun attaquant : ouvrir une pull request ici demande un accès en
      # écriture, et un seul compte en a un. Activer la règle le jour où une
      # deuxième personne obtient cet accès — c'est le jour où un propriétaire
      # de code distinct de l'auteur existe, et le jour où l'écart acquiert
      # quelqu'un capable de s'en servir.
      #
      # D'ici là, l'indice est l'horloge : un `Claude review` vert en une
      # quinzaine de secondes n'a rien relu. C'est ce que mesure le travail
      # `status` ci-dessous.
      - uses: anthropics/claude-code-action@d9a44dc489924665d246f0fd0508d102211be397 # v1
        if: steps.guard.outputs.present == 'true'
        with:
          # S'authentifie contre l'abonnement Claude du mainteneur plutôt que
          # contre une clé d'API facturée à l'appel. Se génère avec
          # `claude setup-token` et se range en secret de dépôt.
          #
          # GitHub retire les secrets des exécutions déclenchées par une pull
          # request venue d'un fork : ce travail ne peut donc pas relire une
          # contribution extérieure — le même trou que SonarCloud a ici, et
          # `docs/quality-pipeline.md` l'enregistre.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # `--comment` est ce qui pose les constats sur la pull request ;
          # sans lui ils partent dans le journal d'exécution et personne ne
          # les lit. La ligne `--allowedTools` n'est pas redondante avec le
          # frontmatter de la compétence : l'action ne démarre le serveur MCP
          # des commentaires en ligne que si `claude_args` nomme cet outil.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'

  # POURQUOI CE TRAVAIL EXISTE. La revue ci-dessus pose des commentaires en
  # ligne quand elle trouve quelque chose et se tait quand elle ne trouve
  # rien : un `Claude review` vert sans commentaire est donc ambigu entre
  # « a lu le diff, rien à signaler » et « a refusé de lire le diff », qui est
  # exactement l'écart documenté au long sur le travail précédent. Un silence
  # lu comme une approbation est le mode de défaillance que
  # `docs/quality-pipeline.md` existe pour enregistrer.
  #
  # La compétence de revue le dirait elle-même : avec `--comment` et aucun
  # constat, elle publie « No issues found ». Cela demande
  # `pull-requests: write`, que le travail de revue n'a délibérément pas —
  # l'accorder là serait pire que le silence, car cette même compétence
  # s'arrête tôt quand « Claude a déjà commenté cette PR », si bien que son
  # propre commentaire de synthèse supprimerait la revue de toutes les
  # poussées suivantes, défaisant la garantie pour laquelle `synchronize`
  # existe. D'où un travail séparé : la permission d'écriture n'atteint jamais
  # l'étape qui exécute Claude, et le commentaire est signé par le workflow et
  # non par Claude, donc il ne déclenche pas cette règle.
  #
  # La durée est la pièce porteuse. Un saut pour cause de fichier modifié sort
  # en `success` en une quinzaine de secondes ; une vraie revue prend des
  # minutes. Lire l'horloge est ce qui transforme « vert » en une affirmation
  # sur ce qui a été lu, sans que personne n'ouvre le journal d'exécution.
  status:
    name: Claude review status
    needs: review
    # `always()` pour qu'une revue échouée ou annulée le dise, au lieu de
    # laisser le commentaire de l'exécution précédente en place. Une pull
    # request en brouillon saute le travail de revue, et celui-ci part avec.
    if: always() && needs.review.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      # Poser et réécrire le commentaire de statut. C'est la permission que le
      # travail de revue n'a délibérément pas.
      pull-requests: write
      # Lire les horodatages du travail de revue via
      # `/actions/runs/{run_id}/jobs`. Ce point d'entrée répond sans cette
      # permission sur un dépôt public — mais le jour où ce dépôt devient
      # privé il cesserait de répondre, et une dépendance au fait d'être
      # public n'est pas une dépendance à laisser tacite.
      actions: read

    steps:
      - name: Poser ou mettre à jour le commentaire de statut
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_RESULT: ${{ needs.review.result }}
          TOKEN_PRESENT: ${{ needs.review.outputs.token_present }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Le marqueur identifie le commentaire de ce workflow, pour que
          # chaque exécution le réécrive au lieu d'en ajouter un. Il est
          # invisible dans le rendu.
          MARKER: "<!-- claude-review-status -->"
        run: |
          set -euo pipefail

          # Une exécution, deux travaux au plus : aucune pagination nécessaire.
          jobs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs")"
          started="$(jq -r '[.jobs[] | select(.name == "Claude review")][0].started_at // ""' <<< "${jobs_json}")"
          finished="$(jq -r '[.jobs[] | select(.name == "Claude review")][0].completed_at // ""' <<< "${jobs_json}")"

          seconds=-1
          if [[ -n "${started}" && -n "${finished}" && "${finished}" != "null" ]]; then
            seconds=$(( $(date -u -d "${finished}" +%s) - $(date -u -d "${started}" +%s) ))
          fi

          if [[ "${seconds}" -ge 0 ]]; then
            elapsed="$(printf '%d min %02d s' $((seconds / 60)) $((seconds % 60)))"
          else
            elapsed="inconnue"
          fi

          # Un saut et une revue propre sortent tous deux en `success` : seule
          # l'horloge les sépare. 60 s est très au-dessus des ~15 s d'un saut
          # et très en dessous des minutes d'une revue, donc aucun des deux
          # cas ne tombe près du seuil.
          # Le résultat du travail se teste EN PREMIER. `token_present` est
          # produit par l'étape `guard` : un travail qui échoue ou qui est
          # annulé avant elle laisse la sortie vide, et la lire d'abord ferait
          # accuser un secret absent alors qu'il est là. Le mainteneur irait
          # créer un secret qui existe déjà au lieu de lire l'échec.
          if [[ "${REVIEW_RESULT}" != "success" ]]; then
            verdict="**La revue ne s'est pas terminée** (\`${REVIEW_RESULT}\`). Rien n'a été relu : considérez cette pull request comme non lue par Claude."
          elif [[ "${TOKEN_PRESENT}" != "true" ]]; then
            verdict="**Aucune revue n'a eu lieu.** Le secret \`CLAUDE_CODE_OAUTH_TOKEN\` n'est pas configuré sur ce dépôt : le travail a été sauté plutôt que de laisser un rouge permanent. Créez-le avec \`claude setup-token\` puis rangez-le dans *Settings → Secrets and variables → Actions*. D'ici là, ce check vert ne dit rien du diff."
          elif [[ "${seconds}" -ge 0 && "${seconds}" -lt 60 ]]; then
            verdict="**Vert sans revue.** Le travail a réussi en ${elapsed}, ce qui est la signature de l'action refusant de tourner — elle le fait quand ce workflow diffère de la copie sur \`main\`. Relisez le diff vous-même, ou fusionnez d'abord la modification du workflow puis relancez."
          else
            verdict="**Relu, rien à signaler.** Les constats, quand il y en a, arrivent en commentaires en ligne sur le diff et non ici ; ce commentaire n'est que la preuve que le relecteur a tourné."
          fi

          body="$(printf '%s\n\n## Revue Claude\n\n%s\n\n| | |\n|---|---|\n| Commit | `%s` |\n| Résultat du travail | `%s` |\n| Durée | %s |\n| Exécution | %s |\n\nPosté par `.github/workflows/claude-review.yml`, réécrit sur place à chaque exécution. Voir `docs/quality-pipeline.md` pour ce que chaque couche prouve et ne prouve pas.\n' \
            "${MARKER}" "${verdict}" "${HEAD_SHA}" "${REVIEW_RESULT}" "${elapsed}" "${RUN_URL}")"

          jq -n --arg body "${body}" '{body: $body}' > payload.json

          existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" | head -n 1 || true)"

          if [[ -n "${existing}" ]]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" --input payload.json >/dev/null
            echo "Commentaire de statut ${existing} mis à jour."
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --input payload.json >/dev/null
            echo "Commentaire de statut créé."
          fi
