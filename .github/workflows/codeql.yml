name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyse CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PHP n'est pas couvert par CodeQL : PHPStan + SonarCloud + tests
        # assurent cette couverture (voir TESTING.md §12).
        language: ['javascript-typescript', 'actions']
    steps:
      - uses: actions/checkout@v4

      - name: Initialisation CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Analyse
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
