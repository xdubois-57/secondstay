name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarcloud:
    name: Analyse SonarCloud
    runs-on: ubuntu-latest
    # La couverture PHP ne vaut que si les deux suites tournent : les tests de
    # base de données exercent l'essentiel des dépôts et des services.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secondstay
          MYSQL_DATABASE: secondstay_test
          MYSQL_USER: secondstay
          MYSQL_PASSWORD: secondstay
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecondstay"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      SECONDSTAY_TEST_DB_HOST: 127.0.0.1
      SECONDSTAY_TEST_DB_PORT: '3306'
      SECONDSTAY_TEST_DB_NAME: secondstay_test
      SECONDSTAY_TEST_DB_USER: secondstay
      SECONDSTAY_TEST_DB_PASSWORD: secondstay
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, zip, gd, dom, sodium
          coverage: pcov
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: composer install --no-interaction --no-progress
      - run: npm ci

      - name: Couverture PHP — suite unitaire
        run: ./vendor/bin/phpunit --testsuite unit --coverage-clover build/coverage/clover-unit.xml --log-junit build/reports/phpunit-junit.xml

      - name: Couverture PHP — suite base de données
        run: ./vendor/bin/phpunit --testsuite database --coverage-clover build/coverage/clover-database.xml

      - name: Couverture JavaScript
        run: npm run test:coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
