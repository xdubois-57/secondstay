name: CI

on:
  push:
    branches: [main, 'claude/**', 'agent/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Toutes les gates du projet, définies une seule fois dans le workflow
  # réutilisable et appelées par les deux pipelines. `ci.yml` est la boucle
  # **rapide** sur chaque poussée ; la passe de release est la passe lente et
  # complète. Les deux ne sont volontairement pas fusionnés — l'intérêt de la
  # première est d'être rapide — mais ils ne doivent pas diverger sur ce que
  # « vert » veut dire.
  #
  # `evidence` reste à sa valeur par défaut (`false`) : une exécution de CI
  # produit un verdict, pas un pack de preuves.
  checks:
    name: Gates
    uses: ./.github/workflows/checks.yml

  sonarcloud:
    # L'analyse consomme les couvertures produites par les travaux
    # précédents. Elle rejouait auparavant la campagne E2E pour son propre
    # compte, dans un second workflow : vingt minutes de calcul pour un
    # résultat déjà obtenu ici.
    name: Analyse SonarCloud
    runs-on: ubuntu-latest
    needs: [checks]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Récupération des couvertures
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: build/artifacts

      - name: Mise en place des rapports
        run: |
          set -euo pipefail
          mkdir -p build/coverage coverage
          cp build/artifacts/coverage-unit/clover-unit.xml build/coverage/
          cp build/artifacts/coverage-database/clover-database.xml build/coverage/
          cp build/artifacts/coverage-js/lcov.info coverage/
          cp build/artifacts/coverage-e2e-desktop-chromium/clover-e2e.xml \
             build/coverage/clover-e2e-desktop.xml
          cp build/artifacts/coverage-e2e-mobile-safari/clover-e2e.xml \
             build/coverage/clover-e2e-mobile.xml
          ls -l build/coverage coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
