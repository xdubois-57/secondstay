name: CI

on:
  push:
    branches: [main, 'claude/**', 'agent/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '22'

jobs:
  php:
    name: PHP — syntaxe, PHPStan, PHPUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, intl, pdo_mysql, zip, gd, dom, sodium
          coverage: pcov
          tools: composer:v2

      - name: Composer install
        run: composer install --no-interaction --no-progress

      - name: Syntaxe PHP
        run: ./scripts/check.sh --php

      - name: PHPUnit avec couverture
        run: ./vendor/bin/phpunit --testsuite unit --coverage-clover build/coverage/clover-unit.xml --log-junit build/reports/phpunit-junit.xml

      - name: Upload des rapports PHP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-reports
          path: build/
          retention-days: 7

      - name: Couverture pour l'analyse
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: build/coverage/clover-unit.xml
          retention-days: 1

  database:
    name: Base de données — migrations et intégration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secondstay
          MYSQL_DATABASE: secondstay_test
          MYSQL_USER: secondstay
          MYSQL_PASSWORD: secondstay
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecondstay"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      SECONDSTAY_TEST_DB_HOST: 127.0.0.1
      SECONDSTAY_TEST_DB_PORT: '3306'
      SECONDSTAY_TEST_DB_NAME: secondstay_test
      SECONDSTAY_TEST_DB_USER: secondstay
      SECONDSTAY_TEST_DB_PASSWORD: secondstay
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, intl, pdo_mysql, zip, gd, dom, sodium
          coverage: pcov
          tools: composer:v2

      - name: Composer install
        run: composer install --no-interaction --no-progress

      # Base jetable : la durabilité n'y sert à rien. Un incident d'exécuteur
      # se répare en relançant la CI, pas en relisant un journal. Sans les
      # écritures synchrones, la remise à zéro entre chaque test — cinquante
      # `TRUNCATE`, cinq cent quatre-vingt-huit fois — cesse d'être dominée par
      # des `fsync`.
      - name: Base de test sans écriture synchrone
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -psecondstay -e "
            SET GLOBAL innodb_flush_log_at_trx_commit = 0;
            SET GLOBAL sync_binlog = 0;
          "

      - name: Tests base de données
        run: ./vendor/bin/phpunit --testsuite database --coverage-clover build/coverage/clover-database.xml

      - name: Couverture pour l'analyse
        uses: actions/upload-artifact@v4
        with:
          name: coverage-database
          path: build/coverage/clover-database.xml
          retention-days: 1

  javascript:
    name: JavaScript — Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Vitest avec couverture
        run: npm run test:coverage

      - name: Upload de la couverture JS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: js-coverage
          path: coverage/
          retention-days: 7

      - name: Couverture pour l'analyse
        uses: actions/upload-artifact@v4
        with:
          name: coverage-js
          path: coverage/lcov.info
          retention-days: 1

  e2e:
    # Un exécuteur par navigateur : la campagne passe de huit minutes à
    # quatre, et chaque projet installe la sienne — un isolement meilleur que
    # l'installation partagée d'avant.
    name: E2E — ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, mobile-safari]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secondstay
          MYSQL_DATABASE: secondstay_test
          MYSQL_USER: secondstay
          MYSQL_PASSWORD: secondstay
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecondstay"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      SECONDSTAY_TEST_DB_HOST: 127.0.0.1
      SECONDSTAY_TEST_DB_PORT: '3306'
      SECONDSTAY_TEST_DB_NAME: secondstay_test
      SECONDSTAY_TEST_DB_USER: secondstay
      SECONDSTAY_TEST_DB_PASSWORD: secondstay
      SECONDSTAY_E2E_PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, intl, pdo_mysql, zip, gd, dom, sodium
          # Les contrôleurs ne sont traversés que par cette campagne : sans
          # pilote de couverture ici, ils apparaîtraient comme non testés.
          coverage: pcov
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: composer install --no-interaction --no-progress
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit

      # Base jetable : la durabilité n'y sert à rien. Un incident d'exécuteur
      # se répare en relançant la CI, pas en relisant un journal. Sans les
      # écritures synchrones, la remise à zéro entre chaque test — cinquante
      # `TRUNCATE`, cinq cent quatre-vingt-huit fois — cesse d'être dominée par
      # des `fsync`.
      - name: Base de test sans écriture synchrone
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -psecondstay -e "
            SET GLOBAL innodb_flush_log_at_trx_commit = 0;
            SET GLOBAL sync_binlog = 0;
          "

      - name: Playwright
        run: ./scripts/check.sh --e2e
        env:
          SECONDSTAY_COVERAGE_DIR: ${{ github.workspace }}/build/coverage/e2e

      - name: Fusion de la couverture E2E
        run: php scripts/coverage-merge.php build/coverage/e2e build/coverage/clover-e2e.xml

      - name: Couverture pour l'analyse
        uses: actions/upload-artifact@v4
        with:
          name: coverage-e2e-${{ matrix.project }}
          path: build/coverage/clover-e2e.xml
          retention-days: 1

      - name: Upload du rapport Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  security:
    name: Sécurité — audit et fuites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, intl, pdo_mysql, zip, gd, dom, sodium
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --no-progress

      - name: Audit et contrôle de secrets
        run: ./scripts/check.sh --security

  release-artifact:
    name: Artefact de release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, intl, pdo_mysql, zip, gd, dom, sodium
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --no-progress

      - name: Construction et inspection du ZIP
        run: ./scripts/build-release-zip.sh --verify-only

      - name: Vérification que l'artefact démarre
        run: |
          set -euo pipefail
          mkdir -p /tmp/artifact
          unzip -q build/release/secondstay-*.zip -d /tmp/artifact
          php -S 127.0.0.1:8321 -t /tmp/artifact/public &
          SERVER_PID=$!
          sleep 3
          curl -fsS http://127.0.0.1:8321/api/version | tee /dev/stderr | grep -q '"version"'
          # Une archive fraîchement déployée n'est pas installée : elle doit
          # conduire à l'assistant d'installation, dans la langue demandée.
          # C'est aussi la preuve que les catalogues de traduction voyagent
          # bien dans le ZIP.
          curl -fsSL http://127.0.0.1:8321/de/ | grep -q 'SecondStay installieren'
          kill "$SERVER_PID"

  sonarcloud:
    # L'analyse consomme les couvertures produites par les travaux
    # précédents. Elle rejouait auparavant la campagne E2E pour son propre
    # compte, dans un second workflow : vingt minutes de calcul pour un
    # résultat déjà obtenu ici.
    name: Analyse SonarCloud
    runs-on: ubuntu-latest
    needs: [php, database, javascript, e2e]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Récupération des couvertures
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: build/artifacts

      - name: Mise en place des rapports
        run: |
          set -euo pipefail
          mkdir -p build/coverage coverage
          cp build/artifacts/coverage-unit/clover-unit.xml build/coverage/
          cp build/artifacts/coverage-database/clover-database.xml build/coverage/
          cp build/artifacts/coverage-js/lcov.info coverage/
          cp build/artifacts/coverage-e2e-desktop-chromium/clover-e2e.xml \
             build/coverage/clover-e2e-desktop.xml
          cp build/artifacts/coverage-e2e-mobile-safari/clover-e2e.xml \
             build/coverage/clover-e2e-mobile.xml
          ls -l build/coverage coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
